<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kartu Proyek</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #2c3e50;
            margin: 30px auto;
            background-color: #ffffff;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        .card h3 {
            color: #1a252f;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .card p {
            font-size: 15px;
            color: #555555;
            line-height: 1.5;
        }

        .card a {
            font-size: 15px;
            color: #d35400;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/proyek1.jpg" alt="Website Toko Online">
            <h3>Website Toko Online</h3>
            <p>Proyek latihan membuat halaman toko sederhana. Dibuat memakai HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <footer style="text-align: center; margin-top: 20px;">
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
