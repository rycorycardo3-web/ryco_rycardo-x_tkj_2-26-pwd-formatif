<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Kontak</title>
    <style>
        body {
            margin: 0;
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        #contact {
            padding: 40px 20px;
        }

        .contact-form {
            width: 400px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #ffffff;
        }

        .contact-form h2 {
            text-align: center;
            color: #1a252f;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .form-group input:focus, .form-group textarea:focus {
            background-color: #eef5fc;
            border-color: #2980b9;
            outline: none;
        }

        .btn-submit {
            background-color: #1a252f;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <section id="contact">
        <form class="contact-form">
            <h2>Hubungi Saya</h2>
            
            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" placeholder="Masukkan nama anda">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email anda">
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" rows="5" placeholder="Tuliskan pesan anda"></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
    </section>

    <footer style="text-align: center; margin-top: 20px;">
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
